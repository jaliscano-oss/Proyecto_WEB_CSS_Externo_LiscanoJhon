<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - ShopEasy</title>
  <link rel="icon" href="../img/icon/carrito-de-compras.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <!-- ENCABEZADO CON LOGO -->
  <header>
    <figure class="logo-contenido">
      <img src="../img/logoCarritoShopEasy.png" alt="Logo carrito ShopEasy" />
    </figure>
    <h1>ShopEasy</h1>
    <p><em>Compra fácil, recibe rápido.</em></p>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <section id="login-principal">

      <figure class="logo-formulario">
        <img src="../img/logoCarritoShopEasy.png" alt="Logo carrito ShopEasy" />
      </figure>

      <h2 id="titulo-login">Iniciar sesión</h2>
      <p>Ingresa con tu cuenta ShopEasy para continuar.</p>

      <form class="formulario-login" action="../home.html" method="get" novalidate>

        <!-- Tipo de usuario -->
        <fieldset>
          <legend>Ingresar como</legend>
          <label><input type="radio" name="rol" value="comprador" checked /> Comprador</label>
          <label><input type="radio" name="rol" value="vendedor" /> Vendedor</label>
          <label><input type="radio" name="rol" value="administrador" /> Administrador</label>
        </fieldset>

        <!-- Correo -->
        <section class="campo-form">
          <label for="email">Correo electrónico <abbr title="campo obligatorio">*</abbr></label>
          <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required />
        </section>

        <!-- Contraseña -->
        <section class="campo-form">
          <label for="password">Contraseña <abbr title="campo obligatorio">*</abbr></label>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required />
        </section>

        <!-- Recordar sesión -->
        <section class="campo-form">
          <label><input type="checkbox" name="recordar" value="si" /> Mantener sesión iniciada</label>
        </section>

        <!-- Botones -->
        <section class="botones-form">
          <button type="submit" class="btn-enviar">Iniciar sesión</button>
          <button type="reset">Limpiar</button>
        </section>
      </form>

      <hr />

      <aside class="links-ayuda">
        <p>¿Olvidaste tu contraseña?</p>
        <p>¿No tienes cuenta? <a href="../registro/registro.html">Regístrate gratis</a></p>
      </aside>

    </section>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>&copy; 2026 ShopEasy &reg; Todos los derechos reservados &trade;</p>
    <nav>
      <ul>
        <li><a href="../home.html">Inicio</a></li>
        <li><a href="../catalogo/catalogo.html">Catálogo</a></li>
        <li><a href="../registro/registro.html">Registrarse</a></li>
      </ul>
    </nav>
  </footer>

</body>

</html>
